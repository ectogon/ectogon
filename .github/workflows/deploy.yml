name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.165.0
      HUGO_SHA256: f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            missing=1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi

          if (( missing )); then
            echo "::error::Add the required values under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Install Hugo
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          hugo_dir="${RUNNER_TEMP}/hugo"
          mkdir -p "${hugo_dir}"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${hugo_dir}" hugo
          echo "${hugo_dir}" >> "${GITHUB_PATH}"

      - name: Build Hugo site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Verify generated site
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/og.png
          test "$(find public/guides -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 10
          test -s public/sitemap.xml
          python3 scripts/validate_site.py

      - name: Deploy Pages site
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.125.0
          command: pages deploy public --project-name=ectogon --branch=main
